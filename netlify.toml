# ============================================================
# NETLIFY DEPLOYMENT CONFIG
# Deploy Next.js 14 to Netlify with full SSR support
# ============================================================

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
